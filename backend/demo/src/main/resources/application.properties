# App Name
spring.application.name=xeno-ingestor

# Database Configuration (Railway provides these via environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/xeno_shopify_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port (Railway sets PORT automatically)
server.port=${PORT:8080}

# Shopify Configuration
shopify.store.url=${SHOPIFY_STORE_URL:https://your-store.myshopify.com}
shopify.access.token=${SHOPIFY_ACCESS_TOKEN:your-access-token}
shopify.api.key=${SHOPIFY_API_KEY:your-api-key}
shopify.api.secret=${SHOPIFY_API_SECRET:your-api-secret}
shopify.api.version=2024-01

# CORS - Allow frontend origin
cors.allowed.origins=${FRONTEND_URL:http://localhost:3000}
