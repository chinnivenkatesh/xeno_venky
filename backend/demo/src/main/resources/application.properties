# App Name
spring.application.name=xeno-ingestor

# Database Configuration - Using H2 in-memory for production
# H2 database works without external MySQL setup
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:xenodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate Settings - auto-detect dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Port (Render sets PORT automatically)
server.port=${PORT:8080}

# Shopify Configuration
shopify.store.url=${SHOPIFY_STORE_URL:https://your-store.myshopify.com}
shopify.access.token=${SHOPIFY_ACCESS_TOKEN:your-access-token}
shopify.api.key=${SHOPIFY_API_KEY:your-api-key}
shopify.api.secret=${SHOPIFY_API_SECRET:your-api-secret}
shopify.api.version=2024-01

# CORS - Allow frontend origin
cors.allowed.origins=${FRONTEND_URL:http://localhost:3000}
