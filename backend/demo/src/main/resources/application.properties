# App Name
spring.application.name=xeno-ingestor

# Database Configuration
# Set these via environment variables or .env file
spring.datasource.url=jdbc:mysql://localhost:3306/xeno_shopify_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# Shopify Configuration
# Set these via environment variables or .env file
shopify.store.url=${SHOPIFY_STORE_URL:https://your-store.myshopify.com}
shopify.access.token=${SHOPIFY_ACCESS_TOKEN:your-access-token}
shopify.api.key=${SHOPIFY_API_KEY:your-api-key}
shopify.api.secret=${SHOPIFY_API_SECRET:your-api-secret}
shopify.api.version=2024-01
